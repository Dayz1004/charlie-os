[package]
name = "charlie-os"
version = "0.1.0"
description = "CHARLIE OS personal time and task management desktop application"
edition = "2021"

[lib]
# Keep the library name distinct from the Windows executable name.
name = "charlie_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
