[package]
name = "charlie-os"
version = "0.1.0"
description = "CHARLIE OS personal time and task management desktop application"
edition = "2021"

[lib]
# Keep the library name distinct from the Windows executable name.
name = "charlie_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
